<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문서 읽기 | CleverSearch</title>
  <style>
    body { margin:0; padding:32px 18px; font-family:'Malgun Gothic',sans-serif; background:#f3f6fb; color:#334155; line-height:1.8; }
    main { max-width:960px; margin:auto; }
    h1 { color:#4338ca; font-size:24px; overflow-wrap:anywhere; }
    .meta { display:flex; gap:8px 18px; flex-wrap:wrap; margin:16px 0; color:#475569; font-size:14px; }
    article,.status { background:white; padding:24px; border:1px solid #d6dfec; border-radius:12px; }
    article { white-space:pre-wrap; overflow-wrap:anywhere; }
    mark { background:#fef08a; color:inherit; }
    .actions { display:flex; gap:12px; margin:20px 0; align-items:center; }
    button,a { font:inherit; }
    button { background:#4338ca; color:white; border:0; border-radius:7px; padding:8px 16px; cursor:pointer; }
    a { color:#4338ca; }
    [hidden] { display:none !important; }
    .error { color:#b91c1c; }
    @media print { body { background:white; padding:0; } .actions { display:none; } article { border:0; } }
  </style>
  <script src="/static/user/document.js" defer></script>
</head>
<body>
  <main>
    <h1 id="documentTitle">문서 읽기</h1>
    <div id="documentMeta" class="meta" hidden></div>
    <p id="documentStatus" class="status" role="status" aria-live="polite">문서를 불러오는 중입니다…</p>
    <article id="documentBody" aria-label="문서 본문" hidden></article>
    <div class="actions">
      <button id="documentRetry" type="button" hidden>다시 시도</button>
      <button id="documentClose" type="button">창 닫기</button>
      <a id="documentSearchLink" href="/">검색 화면으로</a>
    </div>
  </main>
</body>
</html>
